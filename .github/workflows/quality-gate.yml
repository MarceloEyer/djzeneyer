name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      SITE_BASE_URL: https://djzeneyer.com
      VITE_WP_SITE_URL: https://djzeneyer.com
      VITE_WP_REST_URL: https://djzeneyer.com/wp-json/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Architecture boundary check
        run: npm run arch:check

      - name: Docs internal links check
        run: npm run docs:links

      - name: API inventory freshness check
        run: npm run api:inventory:check

      - name: i18n parity check
        run: npm run i18n:check

      - name: UTF-8 content check
        run: npm run utf8:check

      - name: Workflow name contract check
        run: npm run workflow-names:check

      - name: SEO invariant check
        run: npm run seo:check

      - name: Security invariant check
        run: |
          node --test scripts/cloudflare-cache-rule.node-test.mjs
          npm run security:check

      - name: Setup PHP for CSP regression
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v3
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify CSP inline style trust boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l inc/csp.php
          curl --fail --silent --show-error --location --max-time 60 --retry 2 \
            https://wordpress.org/wordpress-6.9.zip -o "$RUNNER_TEMP/wordpress-csp.zip"
          unzip -q "$RUNNER_TEMP/wordpress-csp.zip" -d "$RUNNER_TEMP/wordpress-csp"
          php scripts/php/test-csp-inline-styles.php "$RUNNER_TEMP/wordpress-csp/wordpress"

      - name: Generate sitemaps
        run: npm run generate-sitemaps

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Performance budget check
        run: npm run perf:budget

      - name: Validate build artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/.vite/manifest.json
          test -f public/sitemap.xml
          test -f public/sitemap-pages.xml
          test -f public/robots.txt

          grep -q 'https://djzeneyer.com' public/sitemap.xml
          grep -q 'https://djzeneyer.com' public/sitemap-pages.xml

      - name: Upload dist artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-quality-gate-dist
          path: |
            dist/
            public/sitemap*.xml
          if-no-files-found: ignore
          retention-days: 3
