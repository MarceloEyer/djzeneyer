name: Lighthouse Audit

on:
  workflow_run:
    workflows: ["🚀 Deploy Frontend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit ${{ matrix.profile }} · production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify production URLs
        env:
          LIGHTHOUSE_PROFILE: ${{ matrix.profile }}
          LIGHTHOUSE_TARGET: production
          LIGHTHOUSE_URL: ${{ vars.LIGHTHOUSE_URL || 'https://djzeneyer.com' }}
        run: |
          node -e "const config = require('./lighthouserc.cjs'); console.log(config.ci.collect.url.join('\n'))" > /tmp/lighthouse-urls.txt
          while IFS= read -r url; do
            echo "Checking ${url}"
            curl --fail --location --show-error --silent \
              --retry 5 --retry-delay 10 \
              --output /dev/null \
              "${url}"
          done < /tmp/lighthouse-urls.txt

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LIGHTHOUSE_PROFILE: ${{ matrix.profile }}
          LIGHTHOUSE_TARGET: production
          LIGHTHOUSE_URL: ${{ vars.LIGHTHOUSE_URL || 'https://djzeneyer.com' }}

      - name: Summarize Lighthouse warnings
        if: always()
        run: node scripts/summarize-lighthouse-results.mjs
