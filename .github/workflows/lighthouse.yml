name: Lighthouse Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse.yml'
      - 'lighthouserc.cjs'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
  workflow_run:
    workflows: ["🚀 Deploy Frontend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit ${{ matrix.profile }} · ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'pull_request' }}
        run: npm ci

      - name: Build preview
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npm run generate-sitemaps
          npm run build
        env:
          NODE_ENV: production
          SITE_BASE_URL: https://djzeneyer.com
          VITE_ASSET_BASE: /
          VITE_WP_SITE_URL: https://djzeneyer.com
          VITE_WP_REST_URL: https://djzeneyer.com/wp-json/

      - name: Run Lighthouse CI
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ github.event_name == 'pull_request' && '' || secrets.LHCI_GITHUB_APP_TOKEN }}
          LIGHTHOUSE_PROFILE: ${{ matrix.profile }}
          LIGHTHOUSE_TARGET: ${{ github.event_name == 'pull_request' && 'local' || 'production' }}

      - name: Summarize Lighthouse warnings
        if: always()
        run: node scripts/summarize-lighthouse-results.mjs
